[pytest]
testpaths = tests
addopts = -ra
filterwarnings =
    ignore:Call to deprecated function stored_results:DeprecationWarning
markers =
    neo4j: needs a running Neo4j with the graph loaded (python src/neo4j_etl.py); skipped automatically otherwise
    ui: Streamlit AppTest; opt-in with RUN_UI_TESTS=1 (use a normal terminal, not the Flatpak VS Code one)
