# docker-compose.yml -- MySQL 8 + Neo4j 5 for local development.
#
#   docker compose up -d          start both (first start loads the schema + seed data)
#   docker compose ps             check health
#   docker compose down           stop (data is kept in named volumes)
#   docker compose down -v        stop AND delete all data (the init scripts then run again)
#
# Settings are read from ".env" in this folder (see .env.example). With Docker use
# MYSQL_PORT=3307 in ".env" so it matches the published port below.
#
# STATUS: written to the official images' documented behaviour; it has not been
# run by the author yet. Please report problems.

services:
  mysql:
    image: mysql:8.0
    container_name: timetable-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_me_root}
      # read by docker/mysql/00_app_user.sh (not by the image itself)
      APP_DB_USER: ${MYSQL_USER:-timetable}
      APP_DB_PASSWORD: ${MYSQL_PASSWORD:-change_me_timetable}
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Files in /docker-entrypoint-initdb.d run once, in alphabetical order, on a fresh volume.
      # 01_schema.sql creates the database itself, so MYSQL_DATABASE is intentionally not set.
      - ./docker/mysql/00_app_user.sh:/docker-entrypoint-initdb.d/00_app_user.sh:ro
      - ./sql/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./sql/02_migration_improvements.sql:/docker-entrypoint-initdb.d/02_migration_improvements.sql:ro
      - ./sql/03_seed_data.sql:/docker-entrypoint-initdb.d/03_seed_data.sql:ro
      - ./sql/04_views_procedures.sql:/docker-entrypoint-initdb.d/04_views_procedures.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  neo4j:
    image: neo4j:5.26-community
    container_name: timetable-neo4j
    restart: unless-stopped
    environment:
      # username/password (password needs 8+ characters)
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-change_me_neo4j}
    ports:
      - "7474:7474"   # Neo4j Browser (http://localhost:7474)
      - "7687:7687"   # Bolt (used by the Python code)
    volumes:
      - neo4j_data:/data

volumes:
  mysql_data:
  neo4j_data:
